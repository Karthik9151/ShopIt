spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/shopit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:shopit}
    password: ${DB_PASSWORD:shopit}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  cors:
    origins: http://localhost:5173
  admin:
    email: ${APP_ADMIN_EMAIL:admin@shopit.test}
    password: ${APP_ADMIN_PASSWORD:}

  payments:
    simulated-enabled: ${APP_PAYMENTS_SIMULATED_ENABLED:true}
