# Local-only ShopIt demo profile.
# Do not activate this profile in Render or any shared/production environment.
# Simulated payments remain disabled unless an owner explicitly configures the
# approved staging environment switch; local demo defaults to false.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/shopit_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:shopit}
    password: ${DB_PASSWORD:}
app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  api-docs:
    enabled: true
  payments:
    simulated-enabled: ${APP_PAYMENTS_SIMULATED_ENABLED:false}
