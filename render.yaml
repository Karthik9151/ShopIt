services:
  - type: web
    name: shopit-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET_BASE64
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "900000"
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      # Owner-only staging switch: set APP_PAYMENTS_SIMULATED_ENABLED=true for demos; keep disabled elsewhere and remove before real payment integration.
      - key: APP_CORS_ORIGINS
        sync: false
      - key: APP_PRICING_SHIPPING_FLAT
        value: "49.00"
      - key: APP_PRICING_FREE_SHIPPING_THRESHOLD
        value: "1999.00"
      - key: APP_PRICING_TAX_RATE
        value: "0.18"

  - type: web
    name: shopit-frontend
    runtime: static
    branch: main
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FREE_SHIPPING_THRESHOLD
        value: "1999.00"
