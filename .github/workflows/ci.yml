name: ShopIt CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm with the Arborist peer-resolution fix
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: Maven tests with MySQL 8 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shopit
          MYSQL_USER: shopit
          MYSQL_PASSWORD: shopit
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/shopit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: shopit
      DB_PASSWORD: shopit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate ephemeral CI authentication credentials
        shell: bash
        run: |
          echo "JWT_SECRET_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "APP_ADMIN_EMAIL=admin-$(cat /proc/sys/kernel/random/uuid)@shopit.test" >> "$GITHUB_ENV"
          echo "APP_ADMIN_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Maven verification (H2 unit/context and MySQL integration)
        working-directory: backend
        run: mvn --batch-mode verify
      - name: Build the Render backend container
        run: docker build --pull --file backend/Dockerfile --tag shopit-api:ci backend
